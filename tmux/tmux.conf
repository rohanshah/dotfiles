##### Terminal capabilities #####

# Use tmux's native 256-color terminfo entry.
set -g default-terminal "tmux-256color"

# Claude Code: modified keys such as Shift+Enter.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Claude Code: notifications and progress escape sequences.
set -g allow-passthrough on

# Required for fullscreen terminal applications.
set -g alternate-screen on


##### Input #####

# Reduce Escape latency for Neovim.
set -sg escape-time 10

# Forward terminal focus changes to applications.
set -g focus-events on

# Enable pane selection, resizing, and application mouse reporting.
set -g mouse on


##### Windows and copy mode #####

setw -g mode-keys vi
setw -g automatic-rename off


##### Bindings #####

# Session tree, sorted by name and initially zoomed.
bind-key s choose-tree -sZ -O name
